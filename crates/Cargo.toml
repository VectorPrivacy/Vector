[workspace]
members = ["vector-calls", "vector-core", "vector-cli", "vector-agent", "concord-cli", "vector-sdk", "vector-web", "vector-push", "vector-pusher"]
resolver = "2"

# Dependencies compile OPTIMIZED even in dev/test; our own crates stay unoptimized
# so incremental builds and debug info are unaffected. The suite is dominated by
# crypto that lives entirely in dependencies — Argon2id at 150MB/10 iterations, plus
# the AEADs — and unoptimized those run orders of magnitude slower than shipped code.
# Same code, same results: this changes compilation, never behaviour.
[profile.dev.package."*"]
opt-level = 3

# Vector Web: the OPFS pool VFS tracks open files in a set and debug-asserts on
# the second close when two connections share a database, as core's pool does.
[profile.dev.package.sqlite-wasm-vfs]
debug-assertions = false

[profile.test.package."*"]
opt-level = 3

# Our own crates under test: the vault stress tests are OUR code, so the
# dependency override above can't reach them. 1 is the measured optimum — 2 and 3
# both run SLOWER (50.9s / 50.2s vs 49.0s) and compile slower, because the vault's
# cost is ~524k atomic writes per set(), which is memory-bandwidth-bound and
# neither vectorizes nor reorders.
[profile.test]
opt-level = 1

[patch.crates-io]
# nostr: SecretKey's Drop used non_secure_erase, which the compiler can optimise away; the fork
# zeroizes with volatile writes. nostr-sdk: its verification cache re-hashes the event ID, and a
# gift wrap's ID is checked but not its throwaway-key signature (NIP-59; readers verify the seal).
nostr = { git = "https://github.com/VectorPrivacy/nostr.git", branch = "vector-v0.45.1" }
nostr-sdk = { git = "https://github.com/VectorPrivacy/nostr.git", branch = "vector-v0.45.1" }
# saturating-time 0.4.0's SystemTime MIN/MAX probe never terminates on Windows
# (100ns clock granularity turns sub-1ns probe steps into no-op "successes"),
# and its saturating ops evaluate those limits eagerly — so tor-netdoc's first
# consensus time-range wrap spins a core forever and Tor freezes at 15%
# bootstrap. Vendored with the probe and eagerness fixed; drop when an upstream
# release ships the fix.
saturating-time = { path = "vendor/saturating-time" }
