[package]
name = "vector-media"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/VectorPrivacy/Vector"
description = "Headless media for Vector: Opus voice in and out of Vector's voice Channels, for bots and servers."
documentation = "https://docs.rs/vector-media"
readme = "README.md"
keywords = ["vector", "voice", "opus", "bot", "nostr"]
categories = ["multimedia::audio", "network-programming"]
rust-version = "1.75"

[dependencies]
vector-core = { path = "../vector-core", version = "0.11.0", default-features = false, features = ["calls"] }
# The connections core hands the engine: must be the iroh core links.
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
# libopus from its bundled source (cmake), as the desktop app builds it.
opus = "0.4"
tokio = { version = "1.49", features = ["rt", "sync", "time", "macros"] }
async-trait = "0.1"
