[package]
name = "vector-gpui"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "Vector on GPUI: the native-rendered client, at parity with the Tauri one."
publish = false

[[bin]]
name = "vector-gpui"
path = "src/main.rs"

[features]
default = ["video", "tor", "i2p"]
# Embedded Tor (Arti) and I2P through the user's router: the networks Routing offers.
tor = ["vector-core/tor"]
i2p = ["vector-core/i2p"]
# Video attachments decode through FFmpeg: the system's, or the desktop client's selective
# static build (scripts/build-ffmpeg.sh) with FFMPEG_DIR set and `video-static`.
video = ["dep:ffmpeg-next"]
video-static = ["video", "ffmpeg-next/static"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "f8cfc7ed9e57503def9479138894f3139f5400cc" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f8cfc7ed9e57503def9479138894f3139f5400cc", default-features = false, features = ["x11", "wayland"] }
vector-core = { path = "../vector-core", features = ["calls", "xdc"] }
anyhow = "1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
log = "0.4"
env_logger = "0.11"
# The live account: core's runtime and the crates its API speaks in.
tokio = { version = "1.49.0", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
futures = "0.3"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
rand = "0.8"
regex = "1"
base64 = "0.22"
nostr-sdk = "=0.45.4"
bip39 = "2.2.2"
zeroize = "1.8"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false }
dirs = "6"
# The message renderer.
pulldown-cmark = { version = "0.13", default-features = false }
unicode-linebreak = "0.1"
# Attachments: decoded at the size they draw.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
fast-thumbhash = "0.2"
qrcodegen = "1.8"
# The desktop client's image codecs, compiled from its sources (src/simd.rs, src/shared.rs).
gif = "0.14"
libwebp-sys = "0.9"
rayon = "1.11.0"
fast_image_resize = "5.5"
crc32fast = "1.5"
simd-adler32 = "0.3"
memchr = "2"
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# Notification sounds: decode, resample, play.
cpal = "0.16"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "wav", "flac", "pcm", "aac", "isomp4", "ogg", "vorbis", "opt-simd"] }
# Calls, devices and the audio engine: the desktop client's own modules (media/).
vector-media = { package = "vector-gpui-media", path = "media" }
tauri = { package = "vector-tauri-shim", path = "tauri-shim" }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"], optional = true }
http = "1.3"
url = "2.5.7"
# 3D model attachments: parsed here, drawn offscreen on the GPU (src/model3d).
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "KHR_materials_emissive_strength", "KHR_texture_transform", "KHR_materials_unlit"] }
tobj = { version = "4", default-features = false }
fbxcel = { version = "0.9", features = ["tree"] }
pollster = "0.4"
# Call video: H.264 both ways (the codec WebCodecs peers send), and the camera.
openh264 = "0.9"
bytes = "1"
nokhwa = { version = "0.10", features = ["input-native"] }

# Screen sharing: X11 read directly; macOS and Windows through xcap.
[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9"

# The same wgpu GPUI draws with on Linux; elsewhere its default backends (Metal, DX12).
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.wgpu]
git = "https://github.com/gfx-rs/wgpu"
rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007"
default-features = false
features = ["std", "metal", "gles", "vulkan", "wgsl", "webgpu"]

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies.wgpu]
git = "https://github.com/gfx-rs/wgpu"
rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007"

# Mini Apps run in the OS webview, through the desktop client's own webview crate.
[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "=0.57.0", default-features = false, features = ["os-webview", "linux-body"] }
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
x11rb = { version = "0.13", features = ["randr"] }

# Its own workspace: GPUI pins dependency versions the main client must not inherit.
[workspace]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# whisper.cpp 1.9.5 with scripts/whisper/patches, as the desktop client builds it.
whisper-rs-sys = { git = "https://github.com/VectorPrivacy/whisper-rs.git", rev = "97540c4ce03944e54aa2da3381a64947b4a824cb" }
nostr = { git = "https://github.com/VectorPrivacy/nostr.git", branch = "vector-v0.45.4" }
nostr-sdk = { git = "https://github.com/VectorPrivacy/nostr.git", branch = "vector-v0.45.4" }
nostr-database = { git = "https://github.com/VectorPrivacy/nostr.git", branch = "vector-v0.45.4" }
saturating-time = { path = "../vendor/saturating-time" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }


[dev-dependencies]
# The shared simd module checks its quantiser against this reference.
color_quant = "1.1"
