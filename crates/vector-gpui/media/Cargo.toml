[package]
name = "vector-gpui-media"
version = "0.1.0"
# The desktop client's modules compile in unchanged, so this crate keeps its edition.
edition = "2021"
license = "MIT"
description = "The desktop client's audio engine, devices and call media, compiled from its sources for the GPUI client."
publish = false

[dependencies]
tauri = { package = "vector-tauri-shim", path = "../tauri-shim" }
vector-core = { path = "../../vector-core", features = ["calls", "xdc"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
cpal = "0.16"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "wav", "flac", "pcm", "aac", "isomp4", "ogg", "vorbis", "opt-simd"] }
opus = "0.4"
rustfft = "6.2"
rand = "0.8"
bytes = "1"
async-trait = "0.1"
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSError", "NSProcessInfo"] }
objc2-core-foundation = "0.3.2"
block2 = "0.6"
dispatch2 = "0.3"
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent", "SCError", "block2", "dispatch2", "objc2-core-media", "objc2-core-graphics"] }
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "CMBlockBuffer", "objc2-core-audio-types"] }
objc2-core-audio-types = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
cc = "1"
