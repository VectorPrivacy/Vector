[package]
name = "vector-pusher"
version = "0.1.0"
edition = "2021"
description = "Vector's blind pusher: delivers sealed push requests it cannot read."
license = "MIT"
publish = false

[dependencies]
vector-push = { path = "../vector-push" }
nostr-sdk = "=0.45.1"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde_json = "1.0"
futures-util = "0.3"
