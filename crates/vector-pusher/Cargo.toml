[package]
name = "vector-pusher"
version = "0.1.0"
edition = "2021"
description = "Vector's blind pusher: delivers sealed push requests it cannot read."
license = "MIT"
publish = false

[dependencies]
vector-push = { path = "../vector-push", features = ["vapid"] }
nostr-sdk = "=0.45.4"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde_json = "1.0"
futures-util = "0.3"
