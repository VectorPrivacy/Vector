[package]
name = "vector_sdk"
version = "0.10.0"
edition = "2021"
description = "Ergonomic Rust SDK for building Vector bots and clients on top of vector-core."
license = "MIT"
keywords = ["nostr", "sdk", "bot", "vector", "messaging"]
categories = ["network-programming", "asynchronous", "api-bindings"]
rust-version = "1.75"
repository = "https://github.com/VectorPrivacy/Vector"
homepage = "https://vectorapp.io"
documentation = "https://docs.rs/vector-sdk"
readme = "README.md"

[dependencies]
# The single source of truth — all protocol logic lives here. Tor stays opt-in
# (vector-core's `tor` feature is off by default) so the SDK's dep tree is light.
# `version` is set so the crate is publishable once vector-core ships to crates.io;
# until then the `path` wins for local builds.
vector-core = { path = "../vector-core", version = "0.9.0", default-features = false }
# Exact-pinned to match vector-core — the nostr alphas are not inter-compatible.
nostr-sdk = "=0.45.1"
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The examples that ship their own Mini App package it at startup.
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }

[features]
default = []
# Pass-through: build vector-core with embedded Tor (Arti). Off by default.
tor = ["vector-core/tor"]
# Mini Apps (WebXDC): join the realtime sessions of shared apps. Pulls in Iroh.
xdc = ["vector-core/xdc"]

[[example]]
name = "echo_bot"

[[example]]
name = "file_bot"

[[example]]
name = "slash_command_bot"

[[example]]
name = "ai_bot"

[[example]]
name = "moderation_bot"

[[example]]
name = "whitelist_bot"

[[example]]
name = "save_files_bot"

[[example]]
name = "xdc_counter_bot"
required-features = ["xdc"]

[[example]]
name = "xdc_tictactoe_2d_bot"
required-features = ["xdc"]

[[example]]
name = "xdc_tictactoe_bot"
required-features = ["xdc"]

[[example]]
name = "xdc_probe"
required-features = ["xdc"]

[[example]]
name = "xdc_oracle_bot"
required-features = ["xdc"]

[[example]]
name = "xdc_spy"
required-features = ["xdc"]
