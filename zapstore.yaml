repository: https://github.com/VectorPrivacy/Vector
match: Vector-arm64-v8a\.apk$
name: Vector
description: |
    Privacy by Principle. No KYC, no metadata, no compromises.

    - End-to-end encrypted DMs using NIP-17
    - Encrypted Communities powered by the Concord protocol: channels, roles, and moderation with zero metadata leakage
    - Built-in Tor integration
    - Multi-Device and Multi-Account support
    - Remote signing (NIP-46 bunker) login
    - Amber (NIP-55) offline signing
    - Self-destructing messages with per-chat timers
    - Bots with Discord-style slash commands
    - Holographic achievement badges (NIP-58)
    - Public community invite links
    - Custom emoji packs and chat wallpapers
    - Voice messaging
    - Private local AI for multilingual translations
    - Profile QR cards with in-app camera scanning
    - Pinned chats and pinned Community messages, synced across devices
    - Biometric unlock with your phone's lock screen
    - Private notifications: hide sender and content from your notification shade
    - Photos strip EXIF and location metadata by default
    - Zero metadata leakage
    - Integrated WebXDC mini-app store (Nexus)
    - Mentions, reactions, emoji shortcodes, image spoilers, and rich link previews
summary: A decentralized, privacy-focused community messenger with zero metadata leakage
