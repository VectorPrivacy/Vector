name: 'publish'

on:
  push:
    branches:
      - release
      # A dry run of the whole release: every build, signed, into a draft tagged
      # rehearsal-v<version>. No publish-triggered workflow acts on that tag.
      - rehearsal

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

env:
  TAG_PREFIX: ${{ github.ref_name == 'rehearsal' && 'rehearsal-' || '' }}
  # The rustc scripts/fdroid-build.sh pins too: a build repeats exactly, and its caches stay warm
  # until this line moves.
  RUST_TOOLCHAIN: 1.98.0
  # A retried `tauri build` reuses this job's dist/ (scripts/build-frontend.mjs).
  VECTOR_FRONTEND_ONCE: ${{ github.sha }}

jobs:
  # The release this push builds into, made once before any build starts: jobs that each made it
  # on demand could race into two drafts. A semver pre-release identifier (`0.4.2-1`) is what makes
  # a build a preview; the GitHub flag and the updater endpoint both come from it, so they can't
  # disagree, and flagging the release keeps `/releases/latest` (the stable channel) off previews.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      id: ${{ steps.r.outputs.id }}
      prerelease: ${{ steps.r.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: r
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          TAG="${TAG_PREFIX}v$VERSION"
          PRE=false
          [[ "$VERSION" == *-* ]] && PRE=true
          if [ "$GITHUB_REF_NAME" = rehearsal ]; then
            NAME="Rehearsal of Vector v$VERSION"
            BODY="Release rehearsal. Never publish this draft; delete it once checked."
          else
            NAME="Vector v$VERSION"
            BODY="A new Vector release arrives! If you can see this, the changelog has not been written yet, wait around to see whats new!"
          fi
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$ID" ]; then
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="$NAME" -f body="$BODY" -F draft=true -F prerelease=$PRE --jq .id)
          fi
          echo "Release $TAG (id $ID, prerelease $PRE)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "prerelease=$PRE" >> $GITHUB_OUTPUT

  publish-tauri:
    needs: release
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # `cold`: no Rust cache. These finish well inside the Intel Mac build, and the repo's
        # caches share 10 GB, so only the jobs that set the release's length keep one. macOS:
        # both on the Intel image, Arm cross-compiled; GitHub's Arm macOS pools often go
        # without a free runner, and the Intel one carries the same Xcode.
        include:
          - platform: 'macos-26-intel' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
            ffmpeg: 'aarch64-apple-darwin'
            # ggml's native CPU probe would read the Intel host.
            ggml_native: 'OFF'
          - platform: 'macos-26-intel' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
            ffmpeg: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            cold: true
          - platform: 'windows-2022'
            args: ''
            ffmpeg: 'x86_64-pc-windows-msvc'
          # ARM: native runners, Whisper on the CPU, and (for now) no video compression.
          - platform: 'ubuntu-22.04-arm'
            args: ''
            cold: true
          - platform: 'windows-11-arm'
            args: ''
            cold: true

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # A throwaway runner: scanning every compiler write costs minutes and protects nothing.
      # The target dir sits at the root of the workspace's drive (D:, the fast disk, on x64),
      # keeping paths short for whisper's CMake build. /Brepro leaves the link time out of the
      # executable, so a rebuild of one commit is identical.
      - name: Prepare the runner (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          echo "CARGO_TARGET_DIR=$drive\t" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C link-arg=/Brepro" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS=-C link-arg=/Brepro" >> $env:GITHUB_ENV

      # ring assembles its ARM64 Windows code with clang; MSVC's assembler can't.
      - name: LLVM (Windows ARM)
        if: matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) {
            if (Get-Command choco -ErrorAction SilentlyContinue) { choco install llvm -y --no-progress }
            else { winget install --id LLVM.LLVM -e --silent --accept-package-agreements --accept-source-agreements }
          }
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          & "C:\Program Files\LLVM\bin\clang.exe" --version

      - name: install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Vulkan SDK (Linux x64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      # vcpkg builds these from source (13 minutes). One fixed key: image updates move vcpkg's
      # baseline weekly, and holding a single build keeps glslc's shader output the same.
      - name: Cache Vulkan (Windows)
        if: matrix.platform == 'windows-2022'
        id: vulkan-cache
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          key: vulkan-x64-windows-headers-loader-spirv-tools-glslc

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-2022' && steps.vulkan-cache.outputs.cache-hit != 'true'
        run: |
          vcpkg install vulkan:x64-windows vulkan-headers:x64-windows vulkan-loader:x64-windows spirv-tools:x64-windows
          Invoke-WebRequest -Uri "https://jskitty.com/glslc.exe" -OutFile "glslc.exe"
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          New-Item -ItemType Directory -Force -Path $vcpkgBin
          Move-Item "glslc.exe" "$vcpkgBin\glslc.exe" -Force

      - name: Vulkan environment (Windows)
        if: matrix.platform == 'windows-2022'
        run: |
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          echo "VULKAN_SDK=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "$vcpkgBin" >> $env:GITHUB_PATH
          & "$vcpkgBin\glslc.exe" --version

      # Video compression (VideoToolbox, Media Foundation) needs a selective FFmpeg; `npm run
      # tauri` turns the feature on when it is present, so a failed FFmpeg build fails the job.
      - name: Cache FFmpeg
        if: matrix.ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: src-tauri/native-deps/ffmpeg/${{ matrix.ffmpeg }}
          key: ffmpeg-${{ matrix.ffmpeg }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (macOS)
        if: startsWith(matrix.platform, 'macos') && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          brew install nasm
          scripts/build-ffmpeg.sh ${{ matrix.ffmpeg }}

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows-2022' && steps.ffmpeg-cache.outputs.cache-hit != 'true'

      - uses: msys2/setup-msys2@v2
        if: matrix.platform == 'windows-2022' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: MSYS
          path-type: inherit
          install: make nasm diffutils

      - name: Build FFmpeg (Windows)
        if: matrix.platform == 'windows-2022' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/build-ffmpeg.sh ${{ matrix.ffmpeg }}

      - name: install frontend dependencies
        run: npm ci

      # Compiled dependencies, reused only where every input matches (source, flags, rustc), so a
      # cached build links the same binary as a cold one. Written by release branches alone: a
      # branch reads only its own caches and master's, never a pull request's.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.cold }}
        id: rust-cache
        with:
          workspaces: src-tauri -> ${{ startsWith(matrix.platform, 'windows') && '../../../../t' || 'target' }}
          key: ${{ matrix.ffmpeg || matrix.platform }}
          save-if: ${{ github.ref_name == 'release' || github.ref_name == 'rehearsal' }}

      # Set only where the matrix asks: any value at all, even empty, turns off whisper's x86-64-v3 pin.
      - name: GGML_NATIVE
        if: matrix.ggml_native
        run: echo "GGML_NATIVE=${{ matrix.ggml_native }}" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          # latest.json is built once by `checksums`: every matrix job editing the shared asset raced.
          includeUpdaterJson: false
          # One more `tauri build` and upload on a failure: a flake this late would otherwise cost
          # the whole job again. tauri.ci.conf.json and VECTOR_FRONTEND_ONCE keep the retry from
          # recompiling the app.
          retryAttempts: 1
          tauriScript: npm run tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json ${{ needs.release.outputs.prerelease == 'true' && '--config src-tauri/tauri.preview.conf.json' || '' }}

      # The executable before bundling: two builds of one commit should print the same hash.
      - name: Fingerprint the binary
        shell: bash
        run: |
          dir="${CARGO_TARGET_DIR:-src-tauri/target}"
          command -v cygpath > /dev/null && dir=$(cygpath -u "$dir")
          for f in "$dir"/release/Vector "$dir"/release/Vector.exe "$dir"/*/release/Vector; do
            [ -f "$f" ] && sha256sum "$f"
          done
          true

      # A moved key (lockfile, toolchain) saves a fresh cache as the job ends. Drop the one it
      # replaces first: both would count against the 10 GB, and eviction takes the oldest-read.
      - name: Drop the superseded Rust cache
        if: steps.rust-cache.outputs.cache-hit == 'false' && (github.ref_name == 'release' || github.ref_name == 'rehearsal')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: v0-rust-${{ matrix.ffmpeg || matrix.platform }}-${{ github.job }}-
        run: |
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/caches" -f ref="$GITHUB_REF" -f key="$PREFIX" \
            --jq '.actions_caches[] | "\(.id) \(.key)"' |
            while read -r id key; do
              echo "dropping $key"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id"
            done

  # Android APKs: the ARM pair (and the universal fallback) alongside x86_64 for Chromebooks and
  # emulators, which ships as its own APK so the universal one doesn't grow.
  publish-android:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - abis: arm
            targets: --target aarch64 --target armv7
          - abis: x86_64
            targets: --target x86_64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Android signing
        run: |
          # Decode the keystore from base64 secret
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $HOME/upload-keystore.jks

          # Create keystore.properties file for Gradle
          cat > src-tauri/gen/android/keystore.properties << EOF
          storeFile=$HOME/upload-keystore.jks
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      # Once more on a failure, compiled crates kept: a flake this late would cost the whole job.
      - name: Build Android APK
        run: npx tauri android build --apk ${{ matrix.targets }} || npx tauri android build --apk ${{ matrix.targets }}
        env:
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Fingerprint the native libraries
        run: sha256sum src-tauri/target/*/release/libvector_lib.so

      # The abi-splits config emits one APK per ARM ABI plus a universal fallback. Built alone,
      # x86_64 is the only ABI in its universal APK, which ships under its own name.
      - name: Collect split APKs
        run: |
          OUT=src-tauri/gen/android/app/build/outputs/apk/universal/release
          if [ "${{ matrix.abis }}" = x86_64 ]; then
            mv "$OUT/app-universal-universal-release.apk" "$OUT/Vector-x86_64.apk"
          else
            mv "$OUT/app-universal-arm64-v8a-release.apk"   "$OUT/Vector-arm64-v8a.apk"
            mv "$OUT/app-universal-armeabi-v7a-release.apk" "$OUT/Vector-armeabi-v7a.apk"
            mv "$OUT/app-universal-universal-release.apk"   "$OUT/Vector.apk"
          fi
          ls -lh "$OUT"/Vector*.apk

      # Upload-only via the gh CLI: it must never PATCH release fields. The old
      # softprops step carried `draft: true`, and once the release was published
      # the (floating) @v2 action started trying to flip it BACK to draft — an
      # operation the Actions token is refused ("Resource not accessible by
      # integration"), failing the whole job. Uploading assets works on drafts
      # and published releases alike.
      - name: Upload APKs to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            gh release upload "${{ needs.release.outputs.tag }}" \
              src-tauri/gen/android/app/build/outputs/apk/universal/release/Vector*.apk \
              --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep $((attempt * 15))
          done
          exit 1

  # The F-Droid flavour, built by `fdroid build` inside F-Droid's own image and
  # signed with the release key: the asset their verifier compares against
  # for the reproducible tier (docs/fdroid/README.md).
  publish-android-fdroid:
    needs: release
    uses: ./.github/workflows/fdroid-build.yaml
    with:
      ref: ${{ github.sha }}
      release_tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # One file that vouches for every download: SHA256SUMS.txt over the release's assets, signed
  # with the updater key the app already trusts (minisign), and a build-provenance attestation per
  # asset so `gh attestation verify` ties each file to this workflow and commit.
  checksums:
    needs: [release, publish-tauri, publish-android, publish-android-fdroid]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/updater-manifest.mjs
            fastlane/metadata/android/en-US/changelogs
          sparse-checkout-cone-mode: false

      - name: Download the release's assets
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          rm -f assets/SHA256SUMS.txt assets/SHA256SUMS.txt.minisig assets/latest.json
          ls -l assets

      # Fails when any desktop build is missing, so a release can't go out with one dropped.
      - name: Updater manifest (latest.json)
        run: |
          node scripts/updater-manifest.mjs assets "$TAG" "$GITHUB_REPOSITORY" > assets/latest.json
          cat assets/latest.json

      - name: SHA256SUMS.txt
        working-directory: assets
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Sign with the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2.12.2 signer sign SHA256SUMS.txt
          # Tauri writes the minisign signature base64-wrapped; minisign reads it raw.
          base64 -d SHA256SUMS.txt.sig > SHA256SUMS.txt.minisig
          rm SHA256SUMS.txt.sig

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            assets/*
            SHA256SUMS.txt

      - name: Upload to the release
        run: gh release upload "$TAG" assets/latest.json SHA256SUMS.txt SHA256SUMS.txt.minisig --clobber --repo "$GITHUB_REPOSITORY"
