name: 'publish'

on:
  push:
    branches:
      - release
      # A dry run of the whole release: every build, signed, into a draft tagged
      # rehearsal-v<version>. No publish-triggered workflow acts on that tag.
      - rehearsal

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

env:
  TAG_PREFIX: ${{ github.ref_name == 'rehearsal' && 'rehearsal-' || '' }}
  # The rustc scripts/fdroid-build.sh pins too: a build repeats exactly, and its caches stay warm
  # until this line moves.
  RUST_TOOLCHAIN: 1.98.0

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
            ffmpeg: 'aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
            ffmpeg: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-2022'
            args: ''
            ffmpeg: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # A throwaway runner: scanning every compiler write costs minutes and protects nothing.
      # D: is the runner's fast disk and keeps paths short for whisper's CMake build. /Brepro
      # leaves the link time out of the executable, so a rebuild of one commit is identical.
      - name: Prepare the runner (Windows)
        if: matrix.platform == 'windows-2022'
        id: win
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          echo "CARGO_TARGET_DIR=D:\t" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C link-arg=/Brepro" >> $env:GITHUB_ENV
          echo "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
          # Install Vulkan SDK with glslc compiler
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      # vcpkg builds these from source (13 minutes). The runner image pins vcpkg, so its version
      # keys the cache: the same image installs the same files.
      - name: Cache Vulkan (Windows)
        if: matrix.platform == 'windows-2022'
        id: vulkan-cache
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          key: vulkan-${{ steps.win.outputs.image }}-vulkan-headers-loader-spirv-tools-glslc

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-2022' && steps.vulkan-cache.outputs.cache-hit != 'true'
        run: |
          vcpkg install vulkan:x64-windows vulkan-headers:x64-windows vulkan-loader:x64-windows spirv-tools:x64-windows
          Invoke-WebRequest -Uri "https://jskitty.com/glslc.exe" -OutFile "glslc.exe"
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          New-Item -ItemType Directory -Force -Path $vcpkgBin
          Move-Item "glslc.exe" "$vcpkgBin\glslc.exe" -Force

      - name: Vulkan environment (Windows)
        if: matrix.platform == 'windows-2022'
        run: |
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          echo "VULKAN_SDK=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "$vcpkgBin" >> $env:GITHUB_PATH
          & "$vcpkgBin\glslc.exe" --version

      # Video compression (VideoToolbox, Media Foundation) needs a selective FFmpeg; `npm run
      # tauri` turns the feature on when it is present. A failed FFmpeg build ships without it.
      - name: Cache FFmpeg
        if: matrix.ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: src-tauri/native-deps/ffmpeg/${{ matrix.ffmpeg }}
          key: ffmpeg-${{ matrix.ffmpeg }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (macOS)
        if: matrix.platform == 'macos-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          brew install nasm
          scripts/build-ffmpeg.sh ${{ matrix.ffmpeg }}

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows-2022' && steps.ffmpeg-cache.outputs.cache-hit != 'true'

      - uses: msys2/setup-msys2@v2
        if: matrix.platform == 'windows-2022' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: MSYS
          path-type: inherit
          install: make nasm diffutils

      - name: Build FFmpeg (Windows)
        if: matrix.platform == 'windows-2022' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: msys2 {0}
        run: scripts/build-ffmpeg.sh ${{ matrix.ffmpeg }}

      - name: install frontend dependencies
        run: npm ci

      # Compiled dependencies, reused only where every input matches (source, flags, rustc), so a
      # cached build links the same binary as a cold one. Written by release branches alone: a
      # branch reads only its own caches and master's, never a pull request's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ${{ matrix.platform == 'windows-2022' && '../../../../t' || 'target' }}
          key: ${{ matrix.ffmpeg || matrix.platform }}
          save-if: ${{ github.ref_name == 'release' || github.ref_name == 'rehearsal' }}

      # A semver pre-release identifier (`0.4.2-1`) is what makes a build a
      # preview. Both the GitHub pre-release flag and the updater endpoint are
      # derived from it here so they can never disagree: flagging the release
      # is what keeps `/releases/latest` (the stable channel) off previews.
      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Building $VERSION"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "config=--config src-tauri/tauri.preview.conf.json" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "config=" >> $GITHUB_OUTPUT
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG_PREFIX }}v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: ${{ github.ref_name == 'rehearsal' && 'Rehearsal of Vector v__VERSION__' || 'Vector v__VERSION__' }}
          releaseBody: ${{ github.ref_name == 'rehearsal' && 'Release rehearsal. Never publish this draft; delete it once checked.' || 'A new Vector release arrives! If you can see this, the changelog has not been written yet, wait around to see whats new!' }}
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          tauriScript: npm run tauri
          args: ${{ matrix.args }} ${{ steps.channel.outputs.config }}

      # The executable before bundling: two builds of one commit should print the same hash.
      - name: Fingerprint the binary
        shell: bash
        run: |
          dir="${CARGO_TARGET_DIR:-src-tauri/target}"
          for f in "$dir"/release/Vector "$dir"/release/Vector.exe "$dir"/*/release/Vector; do
            [ -f "$f" ] && sha256sum "$f"
          done
          true

  # Android APK Build
  publish-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
          save-if: ${{ github.ref_name == 'release' || github.ref_name == 'rehearsal' }}

      - name: Setup Android signing
        run: |
          # Decode the keystore from base64 secret
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $HOME/upload-keystore.jks

          # Create keystore.properties file for Gradle
          cat > src-tauri/gen/android/keystore.properties << EOF
          storeFile=$HOME/upload-keystore.jks
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: Build Android APK
        run: npx tauri android build --apk --target aarch64 --target armv7
        env:
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Fingerprint the native libraries
        run: sha256sum src-tauri/target/*/release/libvector_lib.so

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # Only used if this job wins the race to create the release; the flag
          # must match the desktop jobs or a preview would land on the stable
          # channel. Android itself picks its channel at runtime from the
          # version's pre-release identifier, so it needs no build-time config.
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=--prerelease" >> $GITHUB_OUTPUT
          else
            echo "PRERELEASE=" >> $GITHUB_OUTPUT
          fi

      - name: Collect split APKs
        run: |
          OUT=src-tauri/gen/android/app/build/outputs/apk/universal/release
          # The abi-splits config emits one APK per ABI plus a universal fallback.
          mv "$OUT/app-universal-arm64-v8a-release.apk"   "$OUT/Vector-arm64-v8a.apk"
          mv "$OUT/app-universal-armeabi-v7a-release.apk" "$OUT/Vector-armeabi-v7a.apk"
          mv "$OUT/app-universal-universal-release.apk"   "$OUT/Vector.apk"
          ls -lh "$OUT"/Vector*.apk

      # Upload-only via the gh CLI: it must never PATCH release fields. The old
      # softprops step carried `draft: true`, and once the release was published
      # the (floating) @v2 action started trying to flip it BACK to draft — an
      # operation the Actions token is refused ("Resource not accessible by
      # integration"), failing the whole job. Uploading assets works on drafts
      # and published releases alike; the create branch only covers the race
      # where this job outruns every desktop job on a brand-new version.
      - name: Upload APKs to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${TAG_PREFIX}v${{ steps.get_version.outputs.VERSION }}"
          if ! gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName --jq '.[].tagName' | grep -qx "$TAG"; then
            gh release create "$TAG" --draft ${{ steps.get_version.outputs.PRERELEASE }} --title "Vector $TAG" --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$TAG" \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/Vector.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/Vector-arm64-v8a.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/Vector-armeabi-v7a.apk \
            --clobber --repo "$GITHUB_REPOSITORY"

  # The version this push releases, for the F-Droid reference build below.
  release-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "tag=${TAG_PREFIX}v$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')" >> $GITHUB_OUTPUT

  # The F-Droid flavour, built by `fdroid build` inside F-Droid's own image and
  # signed with the release key: the asset their verifier compares against
  # for the reproducible tier (docs/fdroid/README.md).
  publish-android-fdroid:
    needs: release-version
    uses: ./.github/workflows/fdroid-build.yaml
    with:
      ref: ${{ github.sha }}
      release_tag: ${{ needs.release-version.outputs.tag }}
    secrets: inherit

  # One file that vouches for every download: SHA256SUMS.txt over the release's assets, signed
  # with the updater key the app already trusts (minisign), and a build-provenance attestation per
  # asset so `gh attestation verify` ties each file to this workflow and commit.
  checksums:
    needs: [release-version, publish-tauri, publish-android, publish-android-fdroid]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-version.outputs.tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download the release's assets
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          rm -f assets/SHA256SUMS.txt assets/SHA256SUMS.txt.minisig
          ls -l assets

      - name: SHA256SUMS.txt
        working-directory: assets
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Sign with the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2.12.2 signer sign SHA256SUMS.txt
          # Tauri writes the minisign signature base64-wrapped; minisign reads it raw.
          base64 -d SHA256SUMS.txt.sig > SHA256SUMS.txt.minisig
          rm SHA256SUMS.txt.sig

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            assets/*
            SHA256SUMS.txt

      - name: Upload to the release
        run: gh release upload "$TAG" SHA256SUMS.txt SHA256SUMS.txt.minisig --clobber --repo "$GITHUB_REPOSITORY"
