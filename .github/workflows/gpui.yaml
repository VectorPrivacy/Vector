name: GPUI build

# The GPUI client on the platforms the cloud box can't build for. Its own workspace and lockfile,
# so nothing here touches the Tauri client's build.
on:
  push:
    branches: [gpui]
    paths:
      - 'crates/vector-gpui/**'
      - 'crates/vector-i18n/**'
      - 'crates/vector-core/**'
      - 'crates/vector-calls/**'
      - 'src-tauri/src/**'
      - '.github/workflows/gpui.yaml'
  pull_request:
    paths:
      - 'crates/vector-gpui/**'
      - 'crates/vector-i18n/**'
      - '.github/workflows/gpui.yaml'
  workflow_dispatch:
  # A release (publish.yaml) builds the updater bundles here, then signs and uploads them itself.
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

permissions:
  contents: read

# A build takes most of an hour; a newer push waits for it rather than cancelling it.
concurrency:
  group: gpui-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.98.0
  CARGO_TERM_COLOR: always

jobs:
  build:
    # The port's own pull request builds on its pushes already.
    if: ${{ !inputs.release_tag && (github.event_name != 'pull_request' || github.head_ref != 'gpui') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The arm64 pool rarely takes a job; the release builds use this one too.
          - platform: macos-26-intel
            features: ''
          # No system FFmpeg on the runner: video attachments draw as files here for now.
          - platform: windows-2022
            features: '--no-default-features --features tor,i2p'
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: crates/vector-gpui
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Prepare the runner (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          echo "CARGO_TARGET_DIR=$drive\t" >> $env:GITHUB_ENV

      - name: FFmpeg (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install ffmpeg@7 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV"

      # Whisper transcribes on Vulkan on x64 Windows, as the desktop client does.
      - name: Cache Vulkan (Windows)
        if: startsWith(matrix.platform, 'windows')
        id: vulkan-cache
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          key: vulkan-x64-windows-headers-loader-spirv-tools-glslc

      - name: Install Vulkan SDK (Windows)
        if: startsWith(matrix.platform, 'windows') && steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: .
        run: |
          vcpkg install vulkan:x64-windows vulkan-headers:x64-windows vulkan-loader:x64-windows spirv-tools:x64-windows
          Invoke-WebRequest -Uri "https://jskitty.com/glslc.exe" -OutFile "glslc.exe"
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          New-Item -ItemType Directory -Force -Path $vcpkgBin
          Move-Item "glslc.exe" "$vcpkgBin\glslc.exe" -Force

      - name: Vulkan environment (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          echo "VULKAN_SDK=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "$vcpkgBin" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/vector-gpui -> ${{ startsWith(matrix.platform, 'windows') && '../../../../t' || 'target' }}
          key: ${{ matrix.platform }}

      - name: Build
        shell: bash
        run: cargo build --locked ${{ matrix.features }}

      - name: Tests
        shell: bash
        run: |
          cargo test --locked ${{ matrix.features }} --lib
          cargo test --locked --manifest-path ../vector-i18n/Cargo.toml

  # Release builds to try the port on a Mac or a PC: a push whose message carries [package].
  # Thin LTO keeps a cold build near an hour; unsigned, so first launch needs the OS's override.
  package:
    if: inputs.release_tag || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package]'))
    strategy:
      fail-fast: false
      matrix:
        # The Tauri client's release targets, on the same runners: each of its installs has a
        # bundle of its own kind to update to. macOS: both on the Intel image, Arm cross-compiled.
        include:
          - platform: macos-26-intel
            target: aarch64-apple-darwin
            out: aarch64-apple-darwin/release
            features: '--target aarch64-apple-darwin --no-default-features --features video-static,tor,i2p'
            ffmpeg: true
            # ggml's native CPU probe would read the Intel host.
            ggml_native: 'OFF'
          - platform: macos-26-intel
            target: x86_64-apple-darwin
            out: x86_64-apple-darwin/release
            features: '--target x86_64-apple-darwin --no-default-features --features video-static,tor,i2p'
            ffmpeg: true
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            # The host's own target: a target directory level pushes whisper's Vulkan shader build past MAX_PATH.
            out: release
            features: '--no-default-features --features video-static,tor,i2p'
            ffmpeg: true
          # scripts/build-ffmpeg.sh has no Windows on Arm target yet: video attachments draw as files.
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            out: release
            features: '--no-default-features --features tor,i2p'
          # The Tauri client's Linux release hosts: their glibc is the floor the packages run on.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            out: release
            features: '--no-default-features --features video-static,tor,i2p'
            ffmpeg: true
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            out: release
            features: '--no-default-features --features video-static,tor,i2p'
            ffmpeg: true
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      # A release's bundles take the Tauri client's names; a test package keeps its own.
      VECTOR_RELEASE: ${{ inputs.release_tag && '1' || '' }}
    defaults:
      run:
        working-directory: crates/vector-gpui
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Prepare the runner (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          echo "CARGO_TARGET_DIR=$drive\t" >> $env:GITHUB_ENV

      # ring assembles its ARM64 Windows code with clang; MSVC's assembler can't.
      - name: LLVM (Windows ARM)
        if: matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) {
            if (Get-Command choco -ErrorAction SilentlyContinue) { choco install llvm -y --no-progress }
            else { winget install --id LLVM.LLVM -e --silent --accept-package-agreements --accept-source-agreements }
          }
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libasound2-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libssl-dev libzstd-dev clang cmake xdg-utils rpm

      # whisper builds its Vulkan backend on x64 Linux, which needs glslc, as in the Tauri release.
      - name: Vulkan SDK (Linux x64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Cache FFmpeg
        if: matrix.ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: src-tauri/native-deps/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (macOS, Linux)
        if: matrix.ffmpeg && !startsWith(matrix.platform, 'windows') && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install nasm; else sudo apt-get install -y nasm; fi
          scripts/build-ffmpeg.sh ${{ matrix.target }}

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.ffmpeg && startsWith(matrix.platform, 'windows') && steps.ffmpeg-cache.outputs.cache-hit != 'true'

      - uses: msys2/setup-msys2@v2
        if: matrix.ffmpeg && startsWith(matrix.platform, 'windows') && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: MSYS
          path-type: inherit
          install: make nasm diffutils

      - name: Build FFmpeg (Windows)
        if: matrix.ffmpeg && startsWith(matrix.platform, 'windows') && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: .
        run: scripts/build-ffmpeg.sh ${{ matrix.target }}

      - name: FFmpeg environment
        if: matrix.ffmpeg
        shell: bash
        run: echo "FFMPEG_DIR=$GITHUB_WORKSPACE/src-tauri/native-deps/ffmpeg/${{ matrix.target }}" >> "$GITHUB_ENV"

      # Set only where the matrix asks: any value at all turns off whisper's x86-64-v3 pin.
      - name: GGML_NATIVE
        if: matrix.ggml_native
        shell: bash
        run: echo "GGML_NATIVE=${{ matrix.ggml_native }}" >> "$GITHUB_ENV"

      - name: macOS environment
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      # Whisper transcribes on Vulkan on x64 Windows, as the desktop client does.
      - name: Cache Vulkan (Windows x64)
        if: matrix.platform == 'windows-2022'
        id: vulkan-cache
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          key: vulkan-x64-windows-headers-loader-spirv-tools-glslc

      - name: Install Vulkan SDK (Windows x64)
        if: matrix.platform == 'windows-2022' && steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: .
        run: |
          vcpkg install vulkan:x64-windows vulkan-headers:x64-windows vulkan-loader:x64-windows spirv-tools:x64-windows
          Invoke-WebRequest -Uri "https://jskitty.com/glslc.exe" -OutFile "glslc.exe"
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          New-Item -ItemType Directory -Force -Path $vcpkgBin
          Move-Item "glslc.exe" "$vcpkgBin\glslc.exe" -Force

      - name: Vulkan environment (Windows x64)
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: |
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          echo "VULKAN_SDK=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "$vcpkgBin" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/vector-gpui -> ${{ startsWith(matrix.platform, 'windows') && '../../../../t' || 'target' }}
          key: package-${{ matrix.target }}

      # In a developer prompt (the FFmpeg build's) rustc takes link.exe from PATH, where bash puts
      # Git's coreutils link first; outside one it finds MSVC's itself.
      - name: Build
        shell: bash
        run: |
          unset VCINSTALLDIR
          cargo build --release --locked ${{ matrix.features }}

      - name: Bundle (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: scripts/bundle-macos.sh target/${{ matrix.out }}/vector-gpui "$RUNNER_TEMP/pkg"

      # NSIS for the Tauri client's NSIS installs, an MSI with its upgrade code for its MSI ones.
      - name: Bundle (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.target }}" -like "aarch64-*") { "arm64" } else { "x64" }
          $prefix = if ($env:VECTOR_RELEASE -eq "1") { "Vector" } else { "Vector-GPUI" }
          $pkg = "$env:RUNNER_TEMP\pkg"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          $exe = "$env:CARGO_TARGET_DIR\${{ matrix.out }}\vector-gpui.exe"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $icon = "$env:GITHUB_WORKSPACE\src-tauri\icons\icon.ico"
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 "/DSOURCE=$exe" "/DICON=$icon" "/DVERSION=$version" `
            "/DOUTFILE=$pkg\${prefix}_${version}_$arch-setup.exe" scripts\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # MSI versions are numeric: a preview's number is the fourth field, as tauri-bundler writes it.
          $msiVersion = $version -replace '-', '.'
          $wix = if ($env:WIX) { "$env:WIX\bin" } else { "" }
          if (-not $wix -or -not (Test-Path "$wix\candle.exe")) {
            $wix = "$env:RUNNER_TEMP\wix"
            Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$env:RUNNER_TEMP\wix.zip"
            Expand-Archive "$env:RUNNER_TEMP\wix.zip" -DestinationPath $wix
          }
          $obj = "$env:RUNNER_TEMP\installer.wixobj"
          & "$wix\candle.exe" -nologo -arch $arch "-dVersion=$msiVersion" "-dSource=$exe" "-dIcon=$icon" `
            -ext WixUIExtension -out $obj scripts\installer.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$wix\light.exe" -nologo -ext WixUIExtension -cultures:en-us `
            -out "$pkg\${prefix}_${version}_${arch}_en-US.msi" $obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $pkg

      - name: Bundle (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          TOOLS: ${{ runner.temp }}/appimage-tools
        run: |
          scripts/bundle-appimage.sh target/${{ matrix.out }} "$RUNNER_TEMP/pkg"
          scripts/bundle-linux-pkg.sh target/${{ matrix.out }} "$RUNNER_TEMP/pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: vector-gpui-${{ matrix.target }}
          path: ${{ runner.temp }}/pkg
          retention-days: 14
