name: distribute

# Store publishing, fired when a stable release goes out: published directly, or a
# pre-release (a stable build held back for testing) promoted to a full release.
# Stable releases only: previews never go to stores, and the pointer release
# carries no APK.
on:
  release:
    types: [released]

jobs:
  zapstore:
    if: github.event.release.tag_name != 'preview' && !github.event.release.prerelease && !startsWith(github.event.release.tag_name, 'rehearsal-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zsp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.4.17 --repo zapstore/zsp \
            --pattern 'zsp-0.4.17-linux-amd64' --output zsp
          chmod +x zsp

      # zsp resolves the newest GitHub release itself; on a stable publish
      # that is this one. zapstore.yaml picks the arm64 store build.
      #
      # SIGN_WITH should be a NIP-46 bunker URL, never the account's nsec:
      # the key stays on the owner's device and the grant can be revoked.
      # Without the secret this is a no-op, so a release never fails on it.
      #
      # The bunker answers only the client key that first used its one-shot
      # secret, and a runner starts with none: ZAPSTORE_BUNKER_CLIENT_KEY is
      # that key, installed where zsp looks for it (docs/zapstore-bunker.md).
      - name: Publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          CLIENT_KEY: ${{ secrets.ZAPSTORE_BUNKER_CLIENT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$SIGN_WITH" ]; then
            echo "::notice::ZAPSTORE_SIGN_WITH not set; publish to Zapstore by hand (zsp publish)."
            exit 0
          fi
          if [ -n "$CLIENT_KEY" ]; then
            signer=$(printf '%s' "$SIGN_WITH" | sed -E 's#^bunker://([0-9a-f]{64}).*#\1#')
            dir="${XDG_CONFIG_HOME:-$HOME/.config}/zsp/bunker-keys"
            install -d -m 700 "$dir"
            ( umask 077; printf '%s\n' "$CLIENT_KEY" > "$dir/$signer.key" )
          fi
          ./zsp publish --quiet zapstore.yaml
