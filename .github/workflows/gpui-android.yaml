name: GPUI Android

# The GPUI client for Android phones, compiled with the runner's NDK: its platform
# (crates/vector-gpui/vendor/gpui_android) and the client itself. Its own concurrency group, so
# it never waits behind or replaces a desktop build.
on:
  push:
    branches: [gpui]
    paths:
      - 'crates/vector-gpui/**'
      - 'crates/vector-i18n/**'
      - 'crates/vector-core/**'
      - 'crates/vector-calls/**'
      - 'src-tauri/src/**'
      - '.github/workflows/gpui-android.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-android-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.98.0
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: platform
          # Expected to fail until the client's desktop-only dependencies are ported.
          - name: client
            experimental: true
    name: check (${{ matrix.name }})
    continue-on-error: ${{ matrix.experimental || false }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/vector-gpui
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android
          components: clippy

      - name: NDK toolchain
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "ANDROID_NDK=$ndk"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/vector-gpui -> target
          key: android-aarch64-${{ matrix.name }}

      # Warnings fail only in our own platform crates: -D warnings would reach the vendored ones too.
      - name: Clippy
        if: matrix.name == 'platform'
        shell: bash
        run: |
          cargo clippy --locked -p gpui_platform -p gpui_android --target aarch64-linux-android \
            --message-format short 2>&1 | tee clippy.log
          ! grep -E '^vendor/gpui_(android|platform)/.*: (warning|error)' clippy.log

      - name: Check
        if: matrix.name == 'client'
        run: cargo check --locked --keep-going --lib --target aarch64-linux-android --no-default-features --features tor,i2p --message-format short

  # The app around the client: Kotlin, manifest and resources, which need no Rust to compile.
  shell:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/vector-gpui/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compile
        run: ./gradlew --no-daemon :app:compileDebugKotlin :app:compileReleaseKotlin
