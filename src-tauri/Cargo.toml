[package]
name = "vector"
version = "0.4.4-2"
description = "A humble attempt at a modern, private, complete Nostr chat client."
authors = ["Formless Labs", "JSKitty", "YuurinBee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["whisper", "tor"]
whisper = ["dep:whisper-rs"]
tor = ["vector-core/tor"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# Dev builds run the login KDF at SHIPPING speed. Argon2id is deliberately
# expensive (150MB, 10 iterations); unoptimized it costs seconds per unlock,
# which is paid on every dev-loop login with Local Encryption on. These crates
# are dependencies, so optimizing them leaves our own build times and debug
# info untouched — same code, same output, just not interpreted at a crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# The at-rest AEADs + hashes the unlock path runs alongside the KDF.
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Vector Core — the single source of truth for all Vector logic
vector-core = { path = "../crates/vector-core", default-features = false }

# NIP features are set on the `nostr` dep in vector-core and unify across the
# workspace; 0.45 removed them from nostr-sdk entirely.
nostr-sdk = "=0.45.1"
nostr-blossom = "=0.45.0"
bip39 = { version = "2.2.2", features = ["rand"] }
tokio = { version = "1.49.0", features = ["sync", "time", "net", "io-util"] }
futures-util = "0.3.31"
tauri = { version = "2.11.5", features = ["macos-private-api", "protocol-asset", "image-png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Same crate Tauri parses `package_info().version` with, so the Android update
# beacon orders preview builds identically to the desktop updater plugin.
semver = "1"
# default-features=false drops `http2`, `default-tls`, and `macos-system-configuration` —
# none of which Vector actually uses (rustls-tls is explicit; HTTP/1.1 is fine for
# all relay/Blossom traffic). `charset` is kept for text-response decoding (link
# previews fetching HTML). `socks` is required for the Tor proxy — without it
# reqwest accepts a `socks5://` Proxy URL but silently does nothing.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "charset", "socks"] }
aes = "0.8.4"
aes-gcm = "0.10.3"
sha2 = "0.10.9"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
tauri-plugin-opener = "2.5.3"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2.4.9"
# Direct use for animated re-encode: the image facade cannot set GIF disposal,
# and frame differencing is unrenderable without DisposalMethod::Keep.
gif = "0.14"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "ico", "bmp"] }
little_exif = "0.6.23"
# libwebp bindings — `image-webp` 0.2.x mishandles ANIM disposal/blend
# composition (transparent frames flicker as previous-frame residue).
# Used solely for the animated-WebP frame path in commands/emoji_packs.rs;
# libwebp is the reference decoder and produces fully-composed RGBA.
webp = "0.3"
fast-thumbhash = "0.2"
base64-simd = "0.8"
cpal = "0.16.0"
hound = "3.5.1"
symphonia = { version = "0.5.5", features = ["mp3", "wav", "flac", "pcm", "aac", "isomp4", "ogg", "vorbis"] }
rustfft = "6.2"
lofty = "0.24"
rusqlite = { version = "0.37", features = ["bundled"] }
rayon = "1.11.0"

# Transitive Dependencies (re-used from frameworks we already utilise, like Tauri)
memchr = "2"
zeroize = "1.8"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# Mini Apps (WebXDC) support
zip = { version = "2.4", default-features = false, features = ["deflate-zlib"] }
toml = "0.8.23"
anyhow = "1.0.99"
http = "1.3"
url = "2.5.7"

# Realtime peer channels (Iroh P2P)
iroh = "1.0"
iroh-gossip = "0.101"
noq-proto = "1.1"
rand = "0.8"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# PIVX Promos (addressless crypto payments)
secp256k1 = "0.29"
ripemd = "0.1.3"
bs58 = "0.5.1"

# Android-only dependencies
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"
openssl = { version = "0.10.81", features = ["vendored"] }
whisper-rs = { version = "0.15.1", optional = true }

# Whisper (with platform-specific GPU acceleration)
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.15.1", features = ["metal"], optional = true }
# Native file clipboard (read/write file references). Already in the lock via
# the wry/tao stack — promoted to direct deps with the pasteboard features on.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.15.1", features = ["vulkan"], optional = true }
# Native file clipboard (CF_HDROP read/write). Already in the lock via the
# wry/tao stack — promoted to a direct dep.
clipboard-win = "5"

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.15.1", features = ["vulkan"], optional = true }
# GTK clipboard (file paste-in via text/uri-list). Pinned to the wry/tao GTK
# generation (0.18) so no duplicate gtk crate is pulled.
gtk = "0.18"
gdk = "0.18"
glib = "0.18"

# For other platforms (not Android, macOS, Windows, or Linux)
[target.'cfg(all(not(target_os = "android"), not(target_os = "macos"), not(windows), not(target_os = "linux")))'.dependencies]
whisper-rs = { version = "0.15.1", optional = true }

# Desktop-only dependencies (deep link single-instance support)
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.0"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"


# MCP bridge for AI-assisted debugging (only included in debug builds via cfg)
tauri-plugin-mcp-bridge = "0.8"

[dev-dependencies]
tempfile = "3"

# Cross-compilation fix: whisper-rs-sys build.rs uses cfg!(target_os = "macos") which
# checks the HOST OS, not the cross-compilation target. Our fork fixes this so Android
# builds from macOS don't try to link Apple's Accelerate/BLAS framework.
[patch.crates-io]
# tao 0.35.3 wraps the Wayland titlebar in an EventBox with `set_above_child(true)`,
# which swallows every click before the minimise/maximise/close buttons see it.
# Upstream deleted that custom CSD in tauri-apps/tao#1218; the fix ships in tao 0.36.0,
# which no published tauri-runtime-wry accepts yet (it requires ^0.35). This rev is
# that commit, where the crate version is still 0.35.3.
# Drop when a released tauri-runtime-wry depends on tao >= 0.36.
tao = { git = "https://github.com/tauri-apps/tao", rev = "07f3742b1833b64be27b1ef991e38d557d4276c9" }
whisper-rs-sys = { git = "https://github.com/VectorPrivacy/whisper-rs.git", branch = "master" }
# nostr SDK's SecretKey Drop uses non_secure_erase which the compiler can optimize away.
# Patched to use zeroize (volatile writes) so secret key bytes are guaranteed cleared from the stack.
# Fork: https://github.com/VectorPrivacy/nostr/tree/zeroize-secretkey-v0.45.1
nostr = { git = "https://github.com/VectorPrivacy/nostr.git", branch = "zeroize-secretkey-v0.45.1" }
# noq's published BBR3 (through 1.1.1) is a partial merge with an unchecked subtraction
# that underflows whenever loss exceeds the loss threshold — panic in dev builds, garbage
# inflight estimate in release (n0-computer/noq#768). Pinned to the quinn-sync commit that
# replaces it wholesale; drop the pin once a noq release ships it (task #398).
noq = { git = "https://github.com/n0-computer/noq.git", rev = "64a7e4cb9b11def5fbfc4cc419df4bfe58a94ee2" }
noq-proto = { git = "https://github.com/n0-computer/noq.git", rev = "64a7e4cb9b11def5fbfc4cc419df4bfe58a94ee2" }
noq-udp = { git = "https://github.com/n0-computer/noq.git", rev = "64a7e4cb9b11def5fbfc4cc419df4bfe58a94ee2" }
# saturating-time 0.4.0's SystemTime MIN/MAX probe never terminates on Windows
# (100ns clock granularity turns sub-1ns probe steps into no-op "successes"),
# and its saturating ops evaluate those limits eagerly — so tor-netdoc's first
# consensus time-range wrap spins a core forever and Tor freezes at 15%
# bootstrap. Vendored with the probe and eagerness fixed; drop when an upstream
# release ships the fix.
saturating-time = { path = "../crates/vendor/saturating-time" }
