[package]
name = "vector"
version = "0.5.0-1"
description = "A humble attempt at a modern, private, complete Nostr chat client."
authors = ["Formless Labs", "JSKitty", "YuurinBee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["whisper", "tor", "i2p"]
whisper = ["dep:whisper-rs"]
tor = ["vector-core/tor"]
# I2P over a router the user already runs, through its SAMv3 bridge.
i2p = ["vector-core/i2p"]
# F-Droid flavour: no in-app updater. The store owns updates, and F-Droid's
# inclusion policy wants the download path absent, not merely gated.
fdroid = []
# Video compression through a selective static FFmpeg: build it with scripts/build-ffmpeg.sh
# and set FFMPEG_DIR to src-tauri/native-deps/ffmpeg/<target>.
video = ["dep:ffmpeg-next"]
# The benchmarks `cargo bench --bench simd` runs: never part of a shipped or test build.
bench = []
# MCP bridge for AI-assisted debugging, desktop debug builds only. scripts/tauri.mjs enables it for `dev`.
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# Benchmarks optimise like a release without its single-unit, whole-program link: the shell's
# benches time code inside one crate, and a rebuild after an edit takes seconds, not minutes.
[profile.bench]
lto = false
codegen-units = 16
incremental = true

# Shipping-speed binary that still carries the debug-only tooling (the MCP bridge,
# dev-speed KDF): `cargo build --profile dev-opt`. For measuring, never for release.
[profile.dev-opt]
inherits = "release"
debug-assertions = true
lto = false
codegen-units = 16
strip = false

# Dev builds run the login KDF at SHIPPING speed. Argon2id is deliberately
# expensive (150MB, 10 iterations); unoptimized it costs seconds per unlock,
# which is paid on every dev-loop login with Local Encryption on. These crates
# are dependencies, so optimizing them leaves our own build times and debug
# info untouched — same code, same output, just not interpreted at a crawl.
# SQLite's C at -O0 runs queries several times slower than shipped builds, which skews
# every timing taken in dev.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# The AEADs + hashes the unlock path and every attachment's encrypt and hash run.
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.universal-hash]
opt-level = 3
[profile.dev.package.bitcoin_hashes]
opt-level = 3
# The image stack: every attachment preview and send decodes, resizes or re-encodes,
# and unoptimized a phone photo costs seconds per pass rather than tens of ms.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
# The SVG renderer: every foreign SVG is drawn to pixels before the webview sees it, and
# unoptimized a full-screen render takes seconds.
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.roxmltree]
opt-level = 3
[profile.dev.package.svgtypes]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.libwebp-sys]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.tiff]
opt-level = 3
[profile.dev.package.fast-thumbhash]
opt-level = 3
# The audio stack: unoptimized, a song's decode (and so its waveform) takes ~80x longer.
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-format-mkv]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3
[profile.dev.package.symphonia-utils-xiph]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.transpose]
opt-level = 3
[profile.dev.package.strength_reduce]
opt-level = 3
[profile.dev.package.primal-check]
opt-level = 3

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bench]]
name = "simd"
harness = false
required-features = ["bench"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
cc = "1"

[dependencies]
# Vector Core — the single source of truth for all Vector logic
vector-core = { path = "../crates/vector-core", default-features = false, features = ["calls", "xdc"] }

# NIP features are set on the `nostr` dep in vector-core and unify across the
# workspace; 0.45 removed them from nostr-sdk entirely.
nostr-sdk = "=0.45.4"
bip39 = { version = "2.2.2", features = ["rand"] }
tokio = { version = "1.49.0", features = ["sync", "time", "net", "io-util"] }
futures-util = "0.3.31"
async-trait = "0.1"
tauri = { version = "2.12.4", features = ["macos-private-api", "protocol-asset", "image-png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Same crate Tauri parses `package_info().version` with, so the Android update
# beacon orders preview builds identically to the desktop updater plugin.
semver = "1"
# The same reqwest as the updater plugin and iroh, so the app links one copy. TLS is handed in
# preconfigured (vector-core's `net::tls_config`, ring only). `charset` is kept for text-response
# decoding (link previews fetching HTML). `socks` is required for the Tor proxy and carries update
# checks — without it reqwest accepts a `socks5://` Proxy URL but silently does nothing.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "charset", "socks", "http2"] }
sha2 = "0.10.9"
argon2 = "0.5.3"
tauri-plugin-opener = "2.5.3"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2.4.9"
# Direct use for animated re-encode: the image facade cannot set GIF disposal,
# and frame differencing is unrenderable without DisposalMethod::Keep.
gif = "0.14"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "ico", "bmp"] }
# SIMD (AVX2/SSE4.1/NEON) resampling for outbound photos: 16x the image crate's on a 12 MP photo.
fast_image_resize = "5.5"
# Checksums for PNG output (deflate is flate2 below).
crc32fast = "1.5"
simd-adler32 = "0.3"
# libwebp, through shared/animated_webp.rs: `image-webp` 0.2.x mishandles ANIM disposal and
# blending, and only libwebp streams an animation a frame at a time.
libwebp-sys = "0.9"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-resampling", "static"], optional = true }
fast-thumbhash = "0.2"
cpal = "0.16.0"
# Calls: libopus built from the bundled source (cmake, as whisper already needs)
opus = "0.4"
bytes = "1"
# opt-simd: AAC/Vorbis IMDCT on rustfft (runtime-dispatched SSE/AVX/NEON), 1.1-1.3x per decode
symphonia = { version = "0.5.5", features = ["mp3", "wav", "flac", "pcm", "aac", "isomp4", "ogg", "vorbis", "opt-simd"] }
rustfft = "6.2"
lofty = "0.24"
rusqlite = { version = "0.38", features = ["bundled", "fallible_uint"] }
rayon = "1.11.0"

# Transitive Dependencies (re-used from frameworks we already utilise, like Tauri)
memchr = "2"
zeroize = "1.8"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# Mini Apps (WebXDC) support
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }
# zlib-rs over C zlib: SIMD checksums and matching, 1.4-1.8x inflate. Any C backend enabled anywhere wins over it.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
toml = "0.8.23"
anyhow = "1.0.99"
http = "1.3"
# Loopback host for cross-origin-isolated Mini Apps (src/miniapps/isolated.rs).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
url = "2.5.7"

# Realtime peer channels (Iroh P2P). No portmapper: an idle node must not open UPnP/NAT-PMP to
# the gateway outside the account's network.
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
noq-proto = "1.3"
rand = "0.8"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# PIVX Promos (addressless crypto payments)
secp256k1 = { version = "0.30", default-features = false, features = ["std"] }
bitcoin_hashes = { version = "1.2", default-features = false, features = ["std"] }

# Android-only dependencies
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"
# Push: the phone makes its own VAPID key for its UnifiedPush endpoint.
vector-push = { path = "../crates/vector-push", features = ["vapid"] }
# Calls: AAudio streams opened as a phone call's (the patched crate below).
ndk = { version = "0.9", default-features = false, features = ["audio"] }
whisper-rs = { version = "0.15.1", optional = true }

# Whisper (with platform-specific GPU acceleration)
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.15.1", features = ["metal"], optional = true }
# Native file clipboard (read/write file references). Already in the lock via
# the wry/tao stack — promoted to direct deps with the pasteboard features on.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSProcessInfo", "NSBundle", "NSDictionary", "NSSet", "NSURL", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
# ScreenCaptureKit: a shared screen's sound, minus our own process, where the
# webview's picker cannot give any.
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent", "SCError", "block2", "dispatch2", "objc2-core-media", "objc2-core-graphics"] }
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "CMBlockBuffer", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2" }
objc2-core-foundation = "0.3.2"
# The screen recording consent's standing answer, for the panel's warning.
objc2-core-graphics = { version = "0.3.2", features = ["CGWindow"] }
block2 = "0.6"
dispatch2 = "0.3"
# Native notifications (services/native_notify/macos.rs).
objc2-user-notifications = { version = "0.3.1", features = ["block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationAction", "UNNotificationAttachment", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger"] }

[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.15.1", features = ["vulkan"], optional = true }
# Native toasts (services/native_notify/windows.rs). Same version tauri, tao and wry use.
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Notifications"] }
# `#[implement]` expands to paths in windows-core.
windows-core = "0.61"
# SetThreadExecutionState: keeps the machine and display awake during a call.
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }
# Native file clipboard (CF_HDROP read/write). Already in the lock via the
# wry/tao stack — promoted to a direct dep.
clipboard-win = "5"
# WebView2 profile calls (webview_cache.rs), on the versions wry links.
webview2-com = "0.39"
webview2-windows-core = { package = "windows-core", version = "0.62" }

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.15.1", features = ["vulkan"], optional = true }
# GTK clipboard (file paste-in via text/uri-list). Pinned to the wry/tao GTK
# generation (0.18) so no duplicate gtk crate is pulled.
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
# Same generation as wry: per-window proxy exemption for loopback-hosted Mini Apps.
webkit2gtk = { version = "2.0", features = ["v2_40"] }

# For other platforms (not Android, macOS, Windows, or Linux)
[target.'cfg(all(not(target_os = "android"), not(target_os = "macos"), not(windows), not(target_os = "linux")))'.dependencies]
whisper-rs = { version = "0.15.1", optional = true }

# Desktop-only dependencies (deep link single-instance support)
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.0"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"

# MCP bridge for AI-assisted debugging; `npm run dev` turns on the `mcp-bridge` feature.
tauri-plugin-mcp-bridge = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
# Reference for the in-house NeuQuant, which must match it bit for bit.
color_quant = "1.1"

# Cross-compilation fix: whisper-rs-sys build.rs uses cfg!(target_os = "macos") which
# checks the HOST OS, not the cross-compilation target. Our fork fixes this so Android
# builds from macOS don't try to link Apple's Accelerate/BLAS framework.
[patch.crates-io]
# Tauri 2.12.4 plus: assets and CSP hashes in a fixed order (reproducible binaries), files
# served in one blocking read, ACL manifests parsed on first use, and events batched into one
# script with large payloads through JSON.parse. Every crate on one rev.
# Fork: https://github.com/VectorPrivacy/tauri/tree/vector-2.12.4
tauri = { git = "https://github.com/VectorPrivacy/tauri.git", rev = "c2318dc3abf8307dfebf55dd1d650d6b9749d57b" }
tauri-runtime = { git = "https://github.com/VectorPrivacy/tauri.git", rev = "c2318dc3abf8307dfebf55dd1d650d6b9749d57b" }
tauri-runtime-wry = { git = "https://github.com/VectorPrivacy/tauri.git", rev = "c2318dc3abf8307dfebf55dd1d650d6b9749d57b" }
tauri-macros = { git = "https://github.com/VectorPrivacy/tauri.git", rev = "c2318dc3abf8307dfebf55dd1d650d6b9749d57b" }
tauri-codegen = { git = "https://github.com/VectorPrivacy/tauri.git", rev = "c2318dc3abf8307dfebf55dd1d650d6b9749d57b" }
tauri-utils = { git = "https://github.com/VectorPrivacy/tauri.git", rev = "c2318dc3abf8307dfebf55dd1d650d6b9749d57b" }
tauri-build = { git = "https://github.com/VectorPrivacy/tauri.git", rev = "c2318dc3abf8307dfebf55dd1d650d6b9749d57b" }
tauri-plugin = { git = "https://github.com/VectorPrivacy/tauri.git", rev = "c2318dc3abf8307dfebf55dd1d650d6b9749d57b" }
# whisper-rs-sys: whisper.cpp 1.9.5 applying ../scripts/whisper/patches (WHISPER_PATCHES in
# the repo-root .cargo/config.toml), KleidiAI on Android arm64, x86-64-v3 releases. Pinned by rev.
# Fork: https://github.com/VectorPrivacy/whisper-rs/tree/whisper-1.9.5
whisper-rs-sys = { git = "https://github.com/VectorPrivacy/whisper-rs.git", rev = "2d0a0d6e865ef3a08310d3d6cf05abab93d35055" }
# nostr: SecretKey's Drop used non_secure_erase, which the compiler can optimise away; the fork
# zeroizes with volatile writes. nostr-sdk: its verification cache re-hashes the event ID, and a
# gift wrap's ID is checked but not its throwaway-key signature (NIP-59; readers verify the seal).
# Fork: https://github.com/VectorPrivacy/nostr/tree/vector-v0.45.1
nostr = { git = "https://github.com/VectorPrivacy/nostr.git", branch = "vector-v0.45.4" }
nostr-sdk = { git = "https://github.com/VectorPrivacy/nostr.git", branch = "vector-v0.45.4" }
nostr-database = { git = "https://github.com/VectorPrivacy/nostr.git", branch = "vector-v0.45.4" }
# saturating-time 0.4.0's SystemTime MIN/MAX probe never terminates on Windows
# (100ns clock granularity turns sub-1ns probe steps into no-op "successes"),
# and its saturating ops evaluate those limits eagerly — so tor-netdoc's first
# consensus time-range wrap spins a core forever and Tor freezes at 15%
# bootstrap. Vendored with the probe and eagerness fixed; drop when an upstream
# release ships the fix.
saturating-time = { path = "../crates/vendor/saturating-time" }
# ndk 0.9.0 plus a switch that opens every AAudio stream as a phone call's (src/audio.rs), its
# API 28 setters found at run time so minSdk 26 still loads, and one lint fix for current Rust.
ndk = { path = "../crates/vendor/ndk" }
