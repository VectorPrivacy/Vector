Changelog: https://github.com/VectorPrivacy/Vector/releases
Donate: https://vector-privacy.gitbook.io/vector-privacy/vector-messenger/more/donations
Bitcoin: bc1q70zhkfuej2cl9nhrxwqcnvrzpwm9kqtrth3tmc

# Name, Summary and Description come from fastlane/metadata in the repo.

RepoType: git
Repo: https://github.com/VectorPrivacy/Vector.git

# The F-Droid flavour compiles the in-app updater out (Cargo feature
# `fdroid`) and is built by scripts/fdroid-build.sh, the same script CI runs to
# produce the Vector-fdroid.apk release asset.
Builds:
  - versionName: 0.4.4
    versionCode: 40499
    commit: 1a7c064bea6e0c36eadd0a2b9cd2306a6935a632
    subdir: src-tauri/gen/android/app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends rustup cmake clang libclang-dev pkg-config nodejs npm
    ndk: 29.0.14206865
    prebuild:
      - cd ../../../..
      - scripts/fdroid-build.sh prepare
    build:
      - cd ../../../..
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export ANDROID_HOME=$$SDK$$
      - export NDK_HOME=$$NDK$$
      - scripts/fdroid-build.sh build
    output: build/outputs/apk/universal/release/app-universal-universal-release-unsigned.apk

# Once F-Droid's rebuild matches the CI-built asset byte for byte, publish
# with Vector's own signature by uncommenting these two lines (README.md,
# "Reproducible"). Fingerprint from `apksigner verify --print-certs`.
# Binaries: https://github.com/VectorPrivacy/Vector/releases/download/v%v/Vector-fdroid.apk
# AllowedAPKSigningKeys: 89bc6c8f6188d26e8a650acbcebd30be72705a05c384651ddb05f9affc06461d

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
UpdateCheckData: src-tauri/gen/android/app/version.properties|versionCode=(\d+)|.|versionName=(.*)
CurrentVersion: 0.4.4
CurrentVersionCode: 40499
